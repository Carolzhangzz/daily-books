<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Books</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', 'Inter', serif;
    background: #0f0f0f;
    color: #e8e6e3;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
  }

  /* Header */
  .header {
    padding: 40px 24px 20px;
    text-align: center;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #f5f0eb;
  }
  .header .date {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .header .subtitle {
    font-size: 14px;
    color: #888;
    margin-top: 4px;
  }

  /* Date Navigation */
  .date-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 8px 24px 16px;
  }
  .date-nav button {
    background: none;
    border: 1px solid #333;
    color: #888;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .date-nav button:hover { border-color: #c9a96e; color: #c9a96e; }
  .date-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .date-nav .current-date {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #999;
  }

  /* Card Indicators */
  .indicators {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 24px 20px;
  }
  .indicators .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    cursor: pointer;
    transition: all 0.3s;
  }
  .indicators .dot.active {
    background: #c9a96e;
    width: 24px;
    border-radius: 4px;
  }

  /* Book Card */
  .card-container {
    padding: 0 24px;
    position: relative;
    overflow: hidden;
  }
  .card {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 32px 24px;
    border: 1px solid #252525;
    transition: opacity 0.3s ease;
  }
  .card.fade-out { opacity: 0; }
  .card .category {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #c9a96e;
    margin-bottom: 16px;
  }
  .card .book-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .card .book-title-en {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #666;
    font-style: italic;
    margin-bottom: 4px;
  }
  .card .author {
    font-size: 14px;
    color: #888;
    margin-bottom: 20px;
  }
  .card .one-liner {
    font-size: 15px;
    color: #c9a96e;
    line-height: 1.6;
    padding: 16px;
    background: #222;
    border-radius: 12px;
    border-left: 3px solid #c9a96e;
    margin-bottom: 20px;
  }
  .card .deep-dive {
    font-size: 15px;
    line-height: 1.9;
    color: #ccc;
  }
  .card .deep-dive p { margin-bottom: 12px; }

  /* Quote Button */
  .quote-btn {
    display: none;
    width: calc(100% - 48px);
    margin: 20px 24px;
    padding: 14px;
    background: linear-gradient(135deg, #1a1a1a, #252525);
    border: 1px solid #333;
    border-radius: 14px;
    color: #c9a96e;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }
  .quote-btn:hover {
    border-color: #c9a96e;
    background: linear-gradient(135deg, #1f1a14, #2a2520);
  }

  /* Swipe hint */
  .swipe-hint {
    display: none;
    text-align: center;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #444;
  }

  /* Quote Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .modal-overlay.active { display: flex; }

  .quote-modal {
    width: 360px;
    max-width: calc(100vw - 32px);
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    padding-top: 48px;
  }

  .modal-close {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(40,40,40,0.8);
    border: 1px solid #444;
    color: #999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    z-index: 110;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close:hover { color: #fff; border-color: #666; }

  .quote-card {
    background: linear-gradient(145deg, #1c1c1c, #111);
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 40px 28px;
    margin-bottom: 16px;
    position: relative;
  }
  .quote-card .quote-mark {
    font-size: 48px;
    color: #c9a96e;
    opacity: 0.3;
    position: absolute;
    top: 16px;
    left: 20px;
    font-family: Georgia, serif;
  }
  .quote-card .quote-text {
    font-size: 17px;
    line-height: 1.8;
    color: #e8e6e3;
    margin-bottom: 16px;
    padding-top: 20px;
  }
  .quote-card .quote-context {
    font-size: 13px;
    color: #777;
    line-height: 1.6;
    padding-top: 12px;
    border-top: 1px solid #2a2a2a;
  }
  .quote-card .quote-source {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #555;
    margin-top: 16px;
    text-align: right;
  }

  .quote-nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    padding-bottom: 20px;
  }
  .quote-nav .q-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    cursor: pointer;
    transition: all 0.3s;
  }
  .quote-nav .q-dot.active { background: #c9a96e; }

  /* History */
  .history {
    padding: 24px;
    margin-top: 20px;
    border-top: 1px solid #1a1a1a;
  }
  .history h3 {
    font-size: 14px;
    color: #555;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .history-item {
    display: block;
    padding: 12px 16px;
    background: #151515;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: inherit;
    border-left: 2px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .history-item:hover, .history-item.active { background: #1a1a1a; border-left-color: #c9a96e; }
  .history-item .h-date {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #555;
  }
  .history-item .h-books {
    font-size: 13px;
    color: #999;
    margin-top: 4px;
  }

  /* No data */
  .no-data {
    text-align: center;
    padding: 80px 24px;
    color: #444;
  }
  .no-data p { margin-bottom: 12px; }
  .no-data code {
    background: #1a1a1a;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: #c9a96e;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #333;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>每 日 三 书</h1>
    <div class="subtitle">Daily Books</div>
    <div class="date" id="headerDate"></div>
  </div>

  <div class="date-nav">
    <button id="prevDay" disabled>&#8249;</button>
    <span class="current-date" id="navDate"></span>
    <button id="nextDay" disabled>&#8250;</button>
  </div>

  <div class="indicators" id="indicators"></div>
  <div class="card-container" id="cardContainer"></div>
  <button class="quote-btn" id="quoteBtn">提取金句</button>
  <div class="swipe-hint">左右滑动切换 · 点击金句可截图分享</div>

  <div class="history" id="history">
    <h3>历 史 记 录</h3>
    <div id="historyList"></div>
  </div>

  <div class="footer">DAILY BOOKS &middot; POWERED BY CLAUDE CODE</div>
</div>

<!-- Quote Modal -->
<div class="modal-overlay" id="quoteModal">
  <button class="modal-close" id="modalClose">&times;</button>
  <div class="quote-modal">
    <div id="quoteCards"></div>
    <div class="quote-nav" id="quoteNav"></div>
  </div>
</div>

<script>
const DATA_DIR = 'data/';
let currentData = null;
let currentBookIndex = 0;
let currentQuoteIndex = 0;
let currentDate = new Date().toISOString().split('T')[0];
let availableDates = [];

// Elements
const cardContainer = document.getElementById('cardContainer');
const quoteModal = document.getElementById('quoteModal');
const quoteBtn = document.getElementById('quoteBtn');
const swipeHint = document.querySelector('.swipe-hint');
const prevBtn = document.getElementById('prevDay');
const nextBtn = document.getElementById('nextDay');

// Event listeners (no inline onclick)
prevBtn.addEventListener('click', () => navigateDay(-1));
nextBtn.addEventListener('click', () => navigateDay(1));
quoteBtn.addEventListener('click', openQuotes);
document.getElementById('modalClose').addEventListener('click', closeQuotes);

// Click overlay to close modal
quoteModal.addEventListener('click', e => {
  if (e.target === quoteModal) closeQuotes();
});

// Touch handling for book cards
let touchStartX = 0;
let touchStartY = 0;
cardContainer.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
cardContainer.addEventListener('touchend', e => {
  const dx = touchStartX - e.changedTouches[0].clientX;
  const dy = touchStartY - e.changedTouches[0].clientY;
  // Only trigger swipe if horizontal movement > vertical (not scrolling)
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx > 0 && currentBookIndex < 2) switchBook(currentBookIndex + 1);
    else if (dx < 0 && currentBookIndex > 0) switchBook(currentBookIndex - 1);
  }
}, { passive: true });

// Quote modal touch
let qTouchStartX = 0;
let qTouchStartY = 0;
quoteModal.addEventListener('touchstart', e => {
  qTouchStartX = e.touches[0].clientX;
  qTouchStartY = e.touches[0].clientY;
}, { passive: true });
quoteModal.addEventListener('touchend', e => {
  const dx = qTouchStartX - e.changedTouches[0].clientX;
  const dy = qTouchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    navigateQuote(dx > 0 ? 1 : -1);
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (quoteModal.classList.contains('active')) {
    if (e.key === 'Escape') closeQuotes();
    else if (e.key === 'ArrowRight') navigateQuote(1);
    else if (e.key === 'ArrowLeft') navigateQuote(-1);
    return;
  }
  if (e.key === 'ArrowRight' && currentBookIndex < 2) switchBook(currentBookIndex + 1);
  else if (e.key === 'ArrowLeft' && currentBookIndex > 0) switchBook(currentBookIndex - 1);
});

async function init() {
  await scanHistory();
  // Load most recent available date, or today
  const startDate = availableDates.length > 0 ? availableDates[0] : currentDate;
  await loadDate(startDate);
}

async function scanHistory() {
  try {
    const res = await fetch(DATA_DIR + 'index.json');
    if (res.ok) {
      const dates = await res.json();
      availableDates = dates.sort().reverse();
    }
  } catch(e) {
    availableDates = [];
  }
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (availableDates.length === 0) {
    list.innerHTML = '<div style="color:#444;text-align:center;padding:20px">暂无记录</div>';
    return;
  }
  list.innerHTML = availableDates.slice(0, 10).map(date =>
    `<div class="history-item${date === currentDate ? ' active' : ''}" data-date="${date}">
      <div class="h-date">${date}</div>
      <div class="h-books" id="hbooks-${date}">Loading...</div>
    </div>`
  ).join('');

  // Click handlers for history items
  list.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => loadDate(item.dataset.date));
  });

  // Load titles
  availableDates.slice(0, 10).forEach(async date => {
    try {
      const res = await fetch(DATA_DIR + date + '.json');
      const data = await res.json();
      const el = document.getElementById('hbooks-' + date);
      if (el) el.textContent = data.books.map(b => b.title_zh).join(' · ');
    } catch(e) {
      const el = document.getElementById('hbooks-' + date);
      if (el) el.textContent = '(无法加载)';
    }
  });
}

async function loadDate(dateStr) {
  currentDate = dateStr;
  document.getElementById('headerDate').textContent = dateStr;
  document.getElementById('navDate').textContent = dateStr;

  // Update nav buttons
  const dateIndex = availableDates.indexOf(dateStr);
  prevBtn.disabled = dateIndex === -1 || dateIndex >= availableDates.length - 1;
  nextBtn.disabled = dateIndex <= 0;

  // Highlight active history item
  document.querySelectorAll('.history-item').forEach(item => {
    item.classList.toggle('active', item.dataset.date === dateStr);
  });

  try {
    const res = await fetch(DATA_DIR + dateStr + '.json');
    if (!res.ok) throw new Error('No data');
    currentData = await res.json();
    currentBookIndex = 0;
    renderIndicators();
    renderBook();
    quoteBtn.style.display = 'block';
    swipeHint.style.display = 'block';
  } catch(e) {
    currentData = null;
    cardContainer.innerHTML = `
      <div class="no-data">
        <p>这天还没有推荐</p>
        <p>在 Claude Code 中运行</p>
        <code>/daily-books</code>
        <p style="margin-top:12px">即可生成推荐</p>
      </div>`;
    document.getElementById('indicators').innerHTML = '';
    quoteBtn.style.display = 'none';
    swipeHint.style.display = 'none';
  }
}

function navigateDay(dir) {
  const idx = availableDates.indexOf(currentDate);
  if (idx === -1) return;
  const newIdx = idx - dir;
  if (newIdx >= 0 && newIdx < availableDates.length) {
    loadDate(availableDates[newIdx]);
  }
}

function renderIndicators() {
  if (!currentData) return;
  const el = document.getElementById('indicators');
  el.innerHTML = currentData.books.map((_, i) =>
    `<div class="dot ${i === currentBookIndex ? 'active' : ''}" data-index="${i}"></div>`
  ).join('');
  el.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => switchBook(parseInt(dot.dataset.index)));
  });
}

function switchBook(index) {
  if (index === currentBookIndex) return;
  const card = cardContainer.querySelector('.card');
  if (card) {
    card.classList.add('fade-out');
    setTimeout(() => {
      currentBookIndex = index;
      renderIndicators();
      renderBook();
    }, 150);
  } else {
    currentBookIndex = index;
    renderIndicators();
    renderBook();
  }
}

function renderBook() {
  if (!currentData) return;
  const book = currentData.books[currentBookIndex];
  const deepDive = book.deep_dive.split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('');
  cardContainer.innerHTML = `
    <div class="card">
      <div class="category">${book.category}</div>
      <div class="book-title">${book.title_zh}</div>
      <div class="book-title-en">${book.title_en}</div>
      <div class="author">${book.author_zh} (${book.author_en}) · ${book.year}</div>
      <div class="one-liner">${book.one_liner}</div>
      <div class="deep-dive">${deepDive}</div>
    </div>`;
}

function openQuotes() {
  if (!currentData) return;
  currentQuoteIndex = 0;
  renderQuoteCard();
  quoteModal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function renderQuoteCard() {
  if (!currentData) return;
  const book = currentData.books[currentBookIndex];
  const quotes = book.quotes;
  document.getElementById('quoteCards').innerHTML = quotes.map((q, i) => `
    <div class="quote-card" style="display:${i === currentQuoteIndex ? 'block' : 'none'}">
      <div class="quote-mark">\u201C</div>
      <div class="quote-text">${q.text}</div>
      <div class="quote-context">${q.context}</div>
      <div class="quote-source">\u2014\u2014 ${book.title_zh}  (${book.title_en})</div>
    </div>
  `).join('');

  const nav = document.getElementById('quoteNav');
  nav.innerHTML = quotes.map((_, i) =>
    `<div class="q-dot ${i === currentQuoteIndex ? 'active' : ''}" data-index="${i}"></div>`
  ).join('');
  nav.querySelectorAll('.q-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      currentQuoteIndex = parseInt(dot.dataset.index);
      renderQuoteCard();
    });
  });
}

function navigateQuote(dir) {
  if (!currentData) return;
  const book = currentData.books[currentBookIndex];
  const newIdx = currentQuoteIndex + dir;
  if (newIdx >= 0 && newIdx < book.quotes.length) {
    currentQuoteIndex = newIdx;
    renderQuoteCard();
  }
}

function closeQuotes() {
  quoteModal.classList.remove('active');
  document.body.style.overflow = '';
}

init();
</script>
</body>
</html>
