<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾页 · PickPage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC','Inter',serif;background:#0f0f0f;color:#e8e6e3;min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:40px}
button,input{-webkit-tap-highlight-color:transparent;font-family:inherit}

/* PC layout */
@media(min-width:900px){
  .app{max-width:1100px;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr auto;gap:0 40px;padding:0 40px 40px}
  .header{grid-column:1/-1;padding:48px 0 16px}
  .header h1{font-size:32px}
  .date-nav{grid-column:1/-1;padding:0 0 20px;justify-content:center}
  .book-tabs{grid-column:1;padding:0 0 16px}
  .card-box{grid-column:1;padding:0}
  #acts{grid-column:1;padding:12px 0 0}
  #acts2{grid-column:1;padding:6px 0 0}
  .card{padding:36px 32px}
  .card .t{font-size:26px}
  .card .dd{font-size:16px;line-height:2}
  .gen{grid-column:2;grid-row:3/5;padding:0;margin:0;border-top:none;border-left:1px solid #1a1a1a;padding-left:32px;align-self:start;position:sticky;top:24px}
  .stats{grid-column:1/-1;padding:16px 0}
  .notes-sec{grid-column:1/-1;padding:0;margin-top:24px;border-top:1px solid #1a1a1a}
  .shelf{grid-column:1/-1;padding:0;margin-top:16px;border-top:1px solid #1a1a1a;padding-top:8px}
  .hist{grid-column:1/-1;padding:0;margin-top:16px;border-top:1px solid #1a1a1a}
  .footer{grid-column:1/-1}
  .actions button{padding:10px 16px;font-size:13px}
  .gen h3{margin-top:4px}
}
@media(min-width:1200px){
  .app{max-width:1200px;grid-template-columns:1fr 380px;padding:0 60px 40px}
}

/* Header */
.header{padding:40px 24px 12px;text-align:center}
.header h1{font-size:26px;font-weight:700;letter-spacing:4px;color:#f5f0eb}
.header .sub{font-size:13px;color:#666;margin-top:6px;font-family:'Inter',sans-serif}

/* Date nav */
.date-nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:8px 24px 16px}
.date-nav button{background:none;border:1px solid #333;color:#888;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;transition:all .2s}
.date-nav button:hover{border-color:#c9a96e;color:#c9a96e}
.date-nav button:disabled{opacity:.3;cursor:not-allowed}
.date-nav span{font-family:'Inter',sans-serif;font-size:14px;color:#999}

/* Book tabs */
.book-tabs{display:flex;gap:0;padding:0 24px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.book-tabs::-webkit-scrollbar{display:none}
.btab{padding:8px 14px;font-size:13px;color:#666;background:#151515;border:1px solid #252525;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btab:first-child{border-radius:8px 0 0 8px}
.btab:last-child{border-radius:0 8px 8px 0}
.btab:not(:first-child){border-left:none}
.btab.on{background:#c9a96e;color:#0f0f0f;border-color:#c9a96e;font-weight:600}

/* Card */
.card-box{padding:0 24px}
.card{background:#1a1a1a;border-radius:20px;padding:28px 22px;border:1px solid #252525}
.card .cat{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#c9a96e;margin-bottom:14px}
.card .t{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:4px}
.card .te{font-family:'Inter',sans-serif;font-size:14px;color:#666;font-style:italic;margin-bottom:4px}
.card .au{font-size:14px;color:#888;margin-bottom:18px}
.card .ol{font-size:15px;color:#c9a96e;line-height:1.6;padding:14px;background:#222;border-radius:12px;border-left:3px solid #c9a96e;margin-bottom:18px}
.card .dd{font-size:15px;line-height:1.9;color:#ccc}
.card .dd p{margin-bottom:12px}

/* Action row */
.actions{display:flex;gap:10px;padding:12px 24px 0}
.actions button{flex:1;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;transition:all .2s;border:1px solid #333}
.btn-quote{background:linear-gradient(135deg,#1a1a1a,#252525);color:#c9a96e}
.btn-quote:hover{border-color:#c9a96e}
.btn-read{background:#151515;color:#888}
.btn-read:hover{border-color:#c9a96e;color:#c9a96e}
.btn-read.done{background:#1a2a1a;border-color:#4a8;color:#6c6}
.acts2{margin-top:0!important;padding-top:6px!important}
.btn-wr{background:#151515;color:#4a9;border:1px solid #333}
.btn-wr:hover{border-color:#4a9}
.btn-more{background:#151515;color:#a9a;border:1px solid #333}
.btn-more:hover{border-color:#c9a96e;color:#c9a96e}
.btn-more.loading{opacity:.5;pointer-events:none}
.ext{margin-top:16px;padding:20px 22px;background:#161616;border-radius:16px;border:1px solid #222;font-size:14px;line-height:1.8;color:#bbb}
.ext h4{color:#c9a96e;font-size:13px;letter-spacing:1px;margin:16px 0 8px;text-transform:uppercase}
.ext h4:first-child{margin-top:0}
.ext p{margin-bottom:8px}
.ext .eq{color:#999;font-style:italic;padding-left:12px;border-left:2px solid #333;margin:6px 0}

/* Generate section */
.gen{padding:20px 24px;margin-top:12px;border-top:1px solid #1a1a1a}
.gen h3{font-size:13px;color:#555;letter-spacing:2px;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{padding:6px 14px;font-size:12px;border-radius:20px;border:1px solid #333;background:#151515;color:#888;cursor:pointer;transition:all .2s}
.pill.on{border-color:#c9a96e;background:#2a2218;color:#c9a96e}
.gen-input{display:flex;gap:8px;margin-bottom:14px}
.gen-input input{flex:1;padding:10px 14px;background:#151515;border:1px solid #333;border-radius:10px;color:#e8e6e3;font-size:14px;outline:none}
.gen-input input::placeholder{color:#555}
.gen-input input:focus{border-color:#c9a96e}
.gen-btns{display:flex;gap:8px}
.gen-btns button{flex:1;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;transition:all .2s}
.btn-gen{background:linear-gradient(135deg,#2a2218,#1a1510);border:1px solid #c9a96e;color:#c9a96e}
.btn-gen:hover{background:linear-gradient(135deg,#3a3020,#2a2518)}
.btn-gen:active{transform:scale(.98)}
.btn-spec{background:#151515;border:1px solid #555;color:#999}
.btn-spec:hover{border-color:#c9a96e;color:#c9a96e}

/* Bookshelf */
.shelf{padding:0 24px;margin-top:20px;border-top:1px solid #1a1a1a}
.shelf-header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer}
.shelf-header h3{font-size:13px;color:#555;letter-spacing:2px}
.shelf-header .cnt{font-family:'Inter',sans-serif;font-size:12px;color:#c9a96e;background:#2a2218;padding:2px 10px;border-radius:10px}
.shelf-header .arrow{color:#555;font-size:14px;transition:transform .2s}
.shelf-header .arrow.open{transform:rotate(90deg)}
.shelf-list{display:none;padding-bottom:16px}
.shelf-list.open{display:block}
.shelf-item{padding:10px 14px;background:#151515;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s;border-left:2px solid transparent}
.shelf-item:hover{background:#1a1a1a;border-left-color:#c9a96e}
.shelf-item .si-info{flex:1}
.shelf-item .si-title{font-size:14px;color:#ccc}
.shelf-item .si-meta{font-size:11px;color:#555;margin-top:2px;font-family:'Inter',sans-serif}
.shelf-item .si-rm{background:none;border:none;color:#555;font-size:18px;cursor:pointer;padding:4px 8px}
.shelf-item .si-rm:hover{color:#c66}
.shelf-empty{color:#444;font-size:13px;text-align:center;padding:20px}

/* History */
.hist{padding:0 24px;margin-top:16px;border-top:1px solid #1a1a1a}
.hist h3{font-size:13px;color:#555;letter-spacing:2px;padding:16px 0 12px}
.hi{padding:10px 14px;background:#151515;border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .2s;border-left:2px solid transparent}
.hi:hover,.hi.on{background:#1a1a1a;border-left-color:#c9a96e}
.hi .hd{font-family:'Inter',sans-serif;font-size:11px;color:#555}
.hi .hb{font-size:13px;color:#888;margin-top:3px}

/* Category colors */
.cat-文学,.cat-文学 *{--cc:#c9a96e}
.cat-哲学,.cat-哲学 *{--cc:#9e8fc9}
.cat-社科,.cat-社科 *{--cc:#6eb5c9}
.cat-科学,.cat-科学 *{--cc:#6ec98a}
.cat-商业,.cat-商业 *{--cc:#c96e6e}
.cat-心理,.cat-心理 *{--cc:#c99e6e}
.cat-传记,.cat-传记 *{--cc:#8ac96e}
.cat-艺术,.cat-艺术 *{--cc:#c96eaa}
.cat-自然,.cat-自然 *{--cc:#6ec9b5}
.cat-数学,.cat-数学 *{--cc:#7e8ec9}

/* Stats bar */
.stats{padding:16px 24px;display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:70px;background:#151515;border-radius:12px;padding:12px;text-align:center}
.stat .sv{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;color:#c9a96e}
.stat .sl{font-size:11px;color:#555;margin-top:2px}

/* Search */
.search-box{margin-bottom:12px}
.search-box input{width:100%;padding:10px 14px;background:#151515;border:1px solid #252525;border-radius:10px;color:#e8e6e3;font-size:13px;outline:none}
.search-box input:focus{border-color:#c9a96e}
.hi-date-group{font-family:'Inter',sans-serif;font-size:11px;color:#444;padding:8px 0 4px;letter-spacing:1px}

.no-data{text-align:center;padding:60px 24px;color:#444}
.no-data code{background:#1a1a1a;padding:4px 12px;border-radius:6px;font-size:14px;color:#c9a96e}
.footer{text-align:center;padding:20px;font-family:'Inter',sans-serif;font-size:11px;color:#333;letter-spacing:1px}

/* Modal */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal.on{display:flex}
.modal-inner{width:360px;max-width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;padding-top:16px}
.modal-x{position:fixed;top:16px;right:16px;background:rgba(40,40,40,.8);border:1px solid #444;color:#999;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;z-index:110;display:flex;align-items:center;justify-content:center}
.modal-x:hover{color:#fff;border-color:#666}
.qcard{background:linear-gradient(145deg,#1c1c1c,#111);border:1px solid #2a2a2a;border-radius:20px;padding:36px 24px;margin-bottom:14px;position:relative}
.qcard .qm{font-size:48px;color:#c9a96e;opacity:.3;position:absolute;top:14px;left:18px;font-family:Georgia,serif}
.qcard .qt{font-size:17px;line-height:1.8;color:#e8e6e3;margin-bottom:14px;padding-top:20px}
.qcard .qc{font-size:13px;color:#777;line-height:1.6;padding-top:12px;border-top:1px solid #2a2a2a}
.qcard .qs{font-family:'Inter',sans-serif;font-size:12px;color:#555;margin-top:14px;text-align:right}
.qnav{display:flex;justify-content:center;gap:8px;padding:8px 0 20px}
.qnav .qd{width:10px;height:10px;border-radius:50%;background:#444;cursor:pointer;transition:all .3s}
.qnav .qd.on{background:#c9a96e}

/* Toast */
/* Progress bar */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;pointer-events:none}
.progress-bar{height:100%;background:linear-gradient(90deg,#c9a96e,#e8c97e,#c9a96e);background-size:200% 100%;width:0;transition:width .3s;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.progress-text{position:fixed;top:8px;right:16px;font-family:'Inter',sans-serif;font-size:11px;color:#c9a96e;z-index:300;opacity:0;transition:opacity .3s}
.progress-text.on{opacity:1}

/* Card skeleton */
.skeleton{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Highlight toolbar */
.hl-bar{position:absolute;background:#252525;border:1px solid #c9a96e;border-radius:10px;padding:4px;display:none;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hl-bar.on{display:flex;gap:2px}
.hl-bar button{background:none;border:none;color:#ccc;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.hl-bar button:hover{background:#333;color:#c9a96e}
mark.hl{background:rgba(201,169,110,.25);border-bottom:2px solid #c9a96e;cursor:pointer;border-radius:2px}

/* Notes panel */
.notes-sec{padding:0 24px;margin-top:16px;border-top:1px solid #1a1a1a}
.notes-header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer}
.notes-header h3{font-size:13px;color:#555;letter-spacing:2px}
.notes-header .cnt{font-family:'Inter',sans-serif;font-size:12px;color:#e8c97e;background:#2a2818;padding:2px 10px;border-radius:10px}
.notes-header .arrow{color:#555;font-size:14px;transition:transform .2s}
.notes-header .arrow.open{transform:rotate(90deg)}
.notes-list{display:none;padding-bottom:16px}
.notes-list.open{display:block}
.note-item{padding:12px 14px;background:#151515;border-radius:10px;margin-bottom:8px;border-left:3px solid #c9a96e}
.note-item .ni-hl{font-size:14px;color:#c9a96e;line-height:1.6;margin-bottom:6px;font-style:italic}
.note-item .ni-note{font-size:13px;color:#bbb;line-height:1.5}
.note-item .ni-meta{font-size:11px;color:#555;margin-top:6px;display:flex;justify-content:space-between;font-family:'Inter',sans-serif}
.note-item .ni-rm{background:none;border:none;color:#555;cursor:pointer;font-size:12px}
.note-item .ni-rm:hover{color:#c66}
.notes-export{margin-top:8px;padding:10px;width:100%;border-radius:10px;background:#1a1a1a;border:1px solid #333;color:#888;font-size:13px;cursor:pointer}
.notes-export:hover{border-color:#c9a96e;color:#c9a96e}
.notes-empty{color:#444;font-size:13px;text-align:center;padding:20px}

/* Note input modal */
.note-input-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:150;justify-content:center;align-items:center}
.note-input-overlay.on{display:flex}
.note-input-box{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:24px;width:340px;max-width:calc(100vw - 32px)}
.note-input-box .nib-hl{font-size:14px;color:#c9a96e;line-height:1.6;margin-bottom:12px;padding:10px;background:#222;border-radius:8px;border-left:3px solid #c9a96e}
.note-input-box textarea{width:100%;height:80px;background:#111;border:1px solid #333;border-radius:8px;color:#e8e6e3;font-size:14px;padding:10px;resize:none;outline:none;font-family:inherit}
.note-input-box textarea:focus{border-color:#c9a96e}
.note-input-box .nib-btns{display:flex;gap:8px;margin-top:12px}
.note-input-box .nib-btns button{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer}
.nib-save{background:#c9a96e;border:none;color:#0f0f0f;font-weight:600}
.nib-cancel{background:none;border:1px solid #333;color:#888}
.nib-hl-only{background:none;border:1px solid #c9a96e;color:#c9a96e}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#c9a96e;color:#0f0f0f;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>拾 页</h1>
    <div class="sub" id="hDate"></div>
  </div>
  <div class="date-nav">
    <button id="prev" disabled>&#8249;</button>
    <span id="navD"></span>
    <button id="next" disabled>&#8250;</button>
  </div>
  <div class="book-tabs" id="tabs"></div>
  <div class="card-box" id="cardBox"></div>
  <div class="actions" id="acts" style="display:none">
    <button class="btn-quote" id="qBtn">金句</button>
    <button class="btn-read" id="rBtn">已读</button>
  </div>
  <div class="actions acts2" id="acts2" style="display:none">
    <button class="btn-wr" id="wrBtn">微信读书</button>
    <button class="btn-more" id="moreBtn">看更多</button>
  </div>

  <!-- Generate -->
  <div class="gen">
    <h3>生 成 新 推 荐</h3>
    <div class="pills" id="pills"></div>
    <div class="gen-input">
      <input id="bookInput" placeholder="输入书名（如：百年孤独）">
    </div>
    <div class="gen-btns">
      <button class="btn-gen" id="genBtn">随机三本</button>
      <button class="btn-spec" id="specBtn">指定这本</button>
    </div>
    <button class="btn-gen" id="surBtn" style="margin-top:8px;width:100%;background:#151515;border:1px solid #555;color:#999">惊喜模式 · 让 AI 自由推荐</button>
    <button class="btn-auto" id="autoBtn" style="margin-top:10px;width:100%;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;border:1px solid #333;background:#151515;color:#888;transition:all .2s">自动浏览模式</button>
  </div>

  <!-- Notes & Highlights -->
  <div class="notes-sec">
    <div class="notes-header" id="notesHead">
      <h3>划 线 笔 记 <span class="cnt" id="notesCnt">0</span></h3>
      <span class="arrow" id="notesArrow">&#9654;</span>
    </div>
    <div class="notes-list" id="notesList"></div>
  </div>

  <!-- Bookshelf -->
  <div class="shelf">
    <div class="shelf-header" id="shelfHead">
      <h3>我 的 书 架 <span class="cnt" id="shelfCnt">0</span></h3>
      <span class="arrow" id="shelfArrow">&#9654;</span>
    </div>
    <div class="shelf-list" id="shelfList"></div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- History -->
  <div class="hist">
    <h3>历 史 记 录</h3>
    <div class="search-box"><input id="searchInput" placeholder="搜索书名、作者..."></div>
    <div id="histList"></div>
  </div>

  <div class="footer">POWERED BY CLAUDE CODE</div>
</div>

<!-- Quote Modal -->
<div class="modal" id="modal">
  <button class="modal-x" id="mx">&times;</button>
  <div class="modal-inner">
    <div id="qCards"></div>
    <div class="qnav" id="qNav"></div>
  </div>
</div>
<!-- Highlight toolbar -->
<div class="hl-bar" id="hlBar">
  <button id="hlNote">+ 笔记</button>
  <button id="hlOnly">划线</button>
</div>
<!-- Note input -->
<div class="note-input-overlay" id="noteOverlay">
  <div class="note-input-box">
    <div class="nib-hl" id="nibHl"></div>
    <textarea id="nibText" placeholder="写下你的想法..."></textarea>
    <div class="nib-btns">
      <button class="nib-cancel" id="nibCancel">取消</button>
      <button class="nib-hl-only" id="nibHlOnly">仅划线</button>
      <button class="nib-save" id="nibSave">保存笔记</button>
    </div>
  </div>
</div>
<div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
<div class="progress-text" id="progText"></div>
<div class="toast" id="toast"></div>

<script>
const D='data/',CATS=['文学','哲学','社科','科学','商业','心理','传记','艺术','自然','数学'];
let data=null,bi=0,qi=0,curDate=new Date().toISOString().split('T')[0],dates=[],selCats=new Set(CATS);
const $=id=>document.getElementById(id),LS=localStorage;

// --- Bookshelf (localStorage) ---
function getShelf(){try{return JSON.parse(LS.getItem('bookshelf')||'[]')}catch{return[]}}
function saveShelf(s){LS.setItem('bookshelf',JSON.stringify(s))}
function isRead(title){return getShelf().some(b=>b.title_zh===title)}
function addToShelf(book){
  const s=getShelf();
  if(!s.some(b=>b.title_zh===book.title_zh)){
    s.push({title_zh:book.title_zh,title_en:book.title_en,author_zh:book.author_zh,category:book.category,entryId:curDate,date:new Date().toISOString().split('T')[0]});
    saveShelf(s);
  }
  renderShelf();updateReadBtn();

const progBar=$('progBar'),progText=$('progText');
let polling=false;

function showProgress(pct,text){
  progBar.style.width=Math.min(pct,95)+'%';
  if(text){progText.textContent=text;progText.classList.add('on')}
}
function hideProgress(){
  progBar.style.width='100%';
  setTimeout(()=>{progBar.style.transition='none';progBar.style.width='0';setTimeout(()=>{progBar.style.transition='width .3s'},50)},300);
  progText.classList.remove('on');

function pollForUpdate(eid){
  if(polling)return;
  polling=true;
  const t0=Date.now();
  let tries=0;
  showProgress(5,'准备中...');
  const iv=setInterval(()=>{
    tries++;
    const elapsed=Math.round((Date.now()-t0)/1000);
    // Simulate progress (Claude usually takes 30-60s)
    const pct=Math.min(5+tries*1.5,90);
    showProgress(pct,'生成中 '+elapsed+'s');
    fetch('/api/status?id='+encodeURIComponent(eid)).then(r=>r.json()).then(d=>{
      if(d.ready){
        clearInterval(iv);polling=false;
        showProgress(100,'完成！');
        setTimeout(hideProgress,800);
        scanHistory().then(()=>{renderHist();renderStats();load(eid)});
      }else if(d.error){
        clearInterval(iv);polling=false;
        hideProgress();
        toast('生成失败，请重试');
      }else if(tries>60){
        clearInterval(iv);polling=false;
        hideProgress();
        toast('超时了，试试刷新页面');
      }
    }).catch(()=>{});
  },2000);
}

async function scanHistory(){
  try{const r=await fetch(D+'index.json?t='+Date.now());if(r.ok)dates=(await r.json()).sort().reverse()}catch{dates=[]}
}

function callBridge(apiPath,fallbackCmd){
  if(isLocal){
    showProgress(3,'提交请求...');
    fetch(apiPath).then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(d=>{
      if(d.id){
        pollForUpdate(d.id);
      }else{
        hideProgress();
        toast('返回异常');
      }
    }).catch(e=>{hideProgress();toast('请求失败: '+e.message)});
  }else{
    navigator.clipboard.writeText(fallbackCmd).then(()=>toast('已复制命令，粘贴到终端运行')).catch(()=>toast(fallbackCmd));
  }
}

// Apply saved highlights to card text
function applyHighlights(){
  if(!data)return;
  const b=data.books[bi];
  const notes=getNotes().filter(n=>n.book===b.title_zh);
  if(!notes.length)return;
  // Walk all text nodes inside .card
  const card=document.querySelector('.card');
  if(!card)return;
  const hlTexts=notes.map(n=>n.text).sort((a,b)=>b.length-a.length); // longest first to avoid partial overlaps
  const walker=document.createTreeWalker(card,NodeFilter.SHOW_TEXT);
  const textNodes=[];
  while(walker.nextNode())textNodes.push(walker.currentNode);
  textNodes.forEach(node=>{
    let html=node.textContent;
    let changed=false;
    hlTexts.forEach(ht=>{
      // Escape regex special chars
      const escaped=ht.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('('+escaped+')','g');
      if(re.test(html)){
        html=html.replace(re,'<mark class="hl">$1</mark>');
        changed=true;
      }
    });
    if(changed){
      const span=document.createElement('span');
      span.innerHTML=html;
      node.parentNode.replaceChild(span,node);
    }
  });
}

function exportNotesAsMd(filterTs){
  let notes=getNotes();
  if(filterTs)notes=notes.filter(n=>filterTs.has(n.ts));
  if(!notes.length){toast('没有笔记可导出');return}
  const grouped={};
  notes.forEach(n=>{
    if(!grouped[n.book])grouped[n.book]=[];
    grouped[n.book].push(n);
  });
  let md='# 拾页 · 读书笔记\n\n导出时间: '+new Date().toLocaleString()+'\n\n';
  for(const [book,items] of Object.entries(grouped)){
    md+=`## ${book}\n\n`;
    items.sort((a,b)=>a.ts-b.ts).forEach(n=>{
      md+=`> ${n.text}\n\n`;
      if(n.note)md+=`${n.note}\n\n`;
      md+=`_${n.date}_\n\n---\n\n`;
    });
  }
  // Download
  const blob=new Blob([md],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='拾页笔记_'+new Date().toISOString().split('T')[0]+'.md';
  a.click();URL.revokeObjectURL(url);
  toast('已导出 Markdown 文件');
}

function renderHist(filter){
  if(!dates.length){$('histList').innerHTML='<div class="shelf-empty">暂无记录</div>';return}
  // Group by date prefix
  const groups={};
  dates.forEach(d=>{
    const day=d.split('_')[0];
    if(!groups[day])groups[day]=[];
    groups[day].push(d);
  });
  let html='';
  for(const [day,ids] of Object.entries(groups)){
    const filtered=filter?ids.filter(d=>{
      const c=histCache[d];
      if(!c)return true;
      return c.books.some(b=>(b.title_zh+b.title_en+b.author_zh+b.author_en).toLowerCase().includes(filter));
    }):ids;
    if(!filtered.length)continue;
    html+=`<div class="hi-date-group">${day}</div>`;
    filtered.forEach(d=>{
      html+=`<div class="hi${d===curDate?' on':''}" data-d="${d}"><div class="hd">${d.split('_')[1]||''}</div><div class="hb" id="hb-${d}">...</div></div>`;
    });
  }
  $('histList').innerHTML=html||'<div class="shelf-empty">无匹配结果</div>';
  $('histList').querySelectorAll('.hi').forEach(h=>h.addEventListener('click',()=>load(h.dataset.d)));
  // Load titles
  dates.forEach(async d=>{
    if(histCache[d]){
      const e=$('hb-'+d);
      if(e)e.textContent=histCache[d].books.map(b=>b.title_zh).join(' · ');
      return;
    }
    try{
      const r=await fetch(D+d+'.json');
      const j=await r.json();
      histCache[d]=j;
      const e=$('hb-'+d);
      if(e)e.textContent=j.books.map(b=>b.title_zh).join(' · ');
      renderStats();
    }catch{}
  });
}

  if(!data)return;
  $('tabs').innerHTML=data.books.map((b,i)=>`<div class="btab${i===bi?' on':''}" data-i="${i}">${b.title_zh}</div>`).join('');
  $('tabs').querySelectorAll('.btab').forEach(t=>t.addEventListener('click',()=>{const i=+t.dataset.i;if(i!==bi)sw(i)}));
}

function sw(i){bi=i;renderTabs();renderCard();updateReadBtn();$('moreBtn').textContent='看更多';$('moreBtn').classList.remove('loading')}

function renderCard(){
  if(!data)return;
  const b=data.books[bi];
  const dd=b.deep_dive.split('\n').filter(p=>p.trim()).map(p=>'<p>'+p+'</p>').join('');
  const catClass='cat-'+(b.category||'').replace(/[与和].*$/,'');
  $('cardBox').innerHTML=`<div class="card ${catClass}"><div class="cat" style="color:var(--cc,#c9a96e)">${b.category}</div><div class="t">${b.title_zh}</div><div class="te">${b.title_en}</div><div class="au">${b.author_zh} (${b.author_en}) · ${b.year}</div><div class="ol" style="border-left-color:var(--cc,#c9a96e);color:var(--cc,#c9a96e)">${b.one_liner}</div><div class="dd">${dd}</div></div>`;
  updateReadBtn();
  applyHighlights();
}

function openQ(){
  if(!data)return;qi=0;renderQ();
  $('modal').classList.add('on');document.body.style.overflow='hidden';
}
function renderQ(){
  if(!data)return;
  const b=data.books[bi],qs=b.quotes;
  $('qCards').innerHTML=qs.map((q,i)=>`<div class="qcard" style="display:${i===qi?'block':'none'}"><div class="qm">\u201C</div><div class="qt">${q.text}</div><div class="qc">${q.context}</div><div class="qs">\u2014\u2014 ${b.title_zh}</div></div>`).join('');
  const nav=$('qNav');
  nav.innerHTML=qs.map((_,i)=>`<div class="qd${i===qi?' on':''}" data-i="${i}"></div>`).join('');
  nav.querySelectorAll('.qd').forEach(d=>d.addEventListener('click',()=>{qi=+d.dataset.i;renderQ()}));
}
function navQ(dir){
  if(!data)return;
  const n=qi+dir;
  if(n>=0&&n<data.books[bi].quotes.length){qi=n;renderQ()}
}
function closeQ(){$('modal').classList.remove('on');document.body.style.overflow=''}

init();
</script>
</body>
</html>
